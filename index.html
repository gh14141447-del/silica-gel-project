<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8" />
  <title>Silica Gel - Precision Motion Control</title>
  <style>
    /* 기본 레이아웃 유지 */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      cursor: none;
    }

    body {
      width: 100%;
      height: 100vh;
      overflow: hidden;
      background: #ffffff;
      font-family: "Pretendard", sans-serif;
    }

    #finger-cursor {
      position: fixed;
      width: 24px;
      height: 24px;
      background: rgba(0, 0, 0, 0.2);
      border: 2px solid #000;
      border-radius: 50%;
      pointer-events: none;
      z-index: 10000;
    }

    .gallery {
      position: relative;
      width: 100%;
      height: 100vh;
      perspective: 1500px;
    }

    .starter {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 220px;
      height: 300px;
      transform: translate(-50%, -50%);
      z-index: 10;
      transition: 1.3s;
      cursor: none;
    }

    .starter img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      mix-blend-mode: multiply;
    }

    .gallery.active .starter {
      opacity: 0;
      pointer-events: none;
    }

    .card {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 220px;
      height: 300px;
      opacity: 0;
      pointer-events: none;
    }

    .card img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      mix-blend-mode: multiply;
    }

    .card1 {
      --target-x: -420px;
    }

    .card2 {
      --target-x: -140px;
    }

    .card3 {
      --target-x: 140px;
    }

    .card4 {
      --target-x: 420px;
    }

    @keyframes cloneSplit {
      0% {
        transform: translate(-50%, -50%);
      }

      100% {
        transform: translate(calc(-50% + var(--target-x)), -50%);
      }
    }

    .gallery.active .card {
      opacity: 1;
      pointer-events: auto;
      animation: cloneSplit 1.5s cubic-bezier(0.19, 1, 0.22, 1) forwards;
    }

    /* 앨범 뷰 */
    .album-view {
      position: absolute;
      inset: 0;
      background: #fff;
      opacity: 0;
      visibility: hidden;
      z-index: 2000;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: 0.6s;
    }

    .album-view.open {
      opacity: 1;
      visibility: visible;
    }

    .album-item {
      position: absolute;
      width: 360px;
      aspect-ratio: 1/1;
      transition: transform 0.6s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.6s;
      opacity: 0;
    }

    .album-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.4s ease-in-out;
    }

    .album-item.center {
      transform: scale(1.1);
      opacity: 1;
      z-index: 5;
    }

    .album-item.left-1 {
      transform: translateX(-450px) scale(0.7);
      opacity: 0.5;
    }

    .album-item.right-1 {
      transform: translateX(450px) scale(0.7);
      opacity: 0.5;
    }

    @keyframes pulseScale {
      0% {
        transform: scale(1.1);
      }

      50% {
        transform: scale(1.25);
      }

      100% {
        transform: scale(1.1);
      }
    }

    .album-item.center.focused img {
      animation: pulseScale 1.2s infinite ease-in-out;
    }

    /* 상세 페이지 */
    .detail-view {
      position: absolute;
      inset: 0;
      background: #fff;
      z-index: 3000;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      visibility: hidden;
      transition: 0.5s;
    }

    .detail-view.active {
      opacity: 1;
      visibility: visible;
    }

    #webcam {
      position: fixed;
      bottom: 20px;
      right: 20px;
      width: 180px;
      height: 135px;
      background: #000;
      border-radius: 12px;
      z-index: 5000;
      transform: scaleX(-1);
      object-fit: cover;
      border: 2px solid #fff;
      opacity: 0.6;
    }

    /* 버튼 스타일 및 강조 */
    .label-btn,
    #albumClose,
    #detailClose {
      cursor: pointer;
      pointer-events: auto;
      z-index: 4000;
      transition: all 0.3s;
    }

    #albumClose {
      position: absolute;
      top: 40px;
      left: 40px;
      padding: 12px 24px;
      background: #000;
      color: #fff;
      border: 2px solid #fff;
      border-radius: 30px;
      font-weight: bold;
    }

    .btn-hovered {
      transform: scale(1.1) !important;
      color: #ff0000 !important;
      font-weight: 900 !important;
      background: #eee !important;
    }
  </style>
</head>

<body>
  <div id="finger-cursor"></div>
  <video id="webcam" autoplay playsinline></video>

  <div class="gallery" id="gallery">
    <div class="starter" id="starter"><img src="images/logo.png"></div>
    <div class="card card1"><img src="images/logo.png"><button class="label-btn"
        style="position:absolute; bottom:-30px; left:50%; transform:translateX(-50%); border:none; background:none; font-weight:bold;">Silica
        gel</button></div>
    <div class="card card2"><img src="images/logo.png"><button class="label-btn"
        style="position:absolute; bottom:-30px; left:50%; transform:translateX(-50%); border:none; background:none; font-weight:bold;">Members</button>
    </div>
    <div class="card card3"><img src="images/logo.png"><button class="label-btn album-open-btn"
        style="position:absolute; bottom:-30px; left:50%; transform:translateX(-50%); border:none; background:none; font-weight:bold;">Album</button>
    </div>
    <div class="card card4"><img src="images/logo.png"><button class="label-btn"
        style="position:absolute; bottom:-30px; left:50%; transform:translateX(-50%); border:none; background:none; font-weight:bold;">Untitle</button>
    </div>

    <section class="album-view" id="albumView">
      <div class="album-stage"
        style="position:relative; width:100%; height:100%; display:flex; align-items:center; justify-content:center;">
        <div class="album-item" data-title="2024 Silica Gel"><img src="images/2024_SilicaGel1.jpeg"></div>
        <div class="album-item" data-title="2025 Silica Gel"><img src="images/2025_Silicagel.jpg"></div>
        <div class="album-item" data-title="Machine Boy"><img src="images/20344913.jpg"></div>
        <div class="album-item" data-title="Kyo181"><img src="images/IMG_7318.WEBP"></div>
        <div class="album-item" data-title="Desert Eagle"><img src="images/80670374_1440052724930_1_600x600.JPG"></div>
      </div>
      <button id="albumClose">CLOSE LIST</button>
    </section>

    <section class="detail-view" id="detailView">
      <div style="text-align:center;">
        <h1 id="detailTitle" style="font-size:3rem; margin-bottom:20px;">Album Detail</h1>
        <button id="detailClose"
          style="padding:15px 40px; background: #333; color: white; border: none; border-radius: 10px; font-weight: bold;">BACK
          TO ALBUMS</button>
      </div>
    </section>
  </div>

  <script type="module">
    import { GestureRecognizer, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3";

    const cursor = document.getElementById("finger-cursor");
    const video = document.getElementById("webcam");
    const albumView = document.getElementById("albumView");
    const detailView = document.getElementById("detailView");
    const albumItems = document.querySelectorAll(".album-item");
    const gallery = document.getElementById("gallery");

    let gestureRecognizer;
    let lastVideoTime = -1;
    let currentIndex = 0;
    let isCooldown = false;
    let prevHandX = 0;
    let stopCounter = 0;

    // UI 제어 함수들
    const openAlbums = () => { albumView.classList.add("open"); updateCarousel(); };
    const closeAlbums = () => { albumView.classList.remove("open"); };
    const closeDetail = () => { detailView.classList.remove("active"); };

    document.getElementById("starter").onclick = () => gallery.classList.add("active");
    document.querySelector(".album-open-btn").onclick = (e) => { e.stopPropagation(); openAlbums(); };
    document.getElementById("albumClose").onclick = (e) => { e.stopPropagation(); closeAlbums(); };
    document.getElementById("detailClose").onclick = (e) => { e.stopPropagation(); closeDetail(); };

    function updateCarousel() {
      albumItems.forEach((item, index) => {
        item.classList.remove("center", "left-1", "right-1", "focused");
        let offset = index - currentIndex;
        if (offset < -2) offset += albumItems.length;
        if (offset > 2) offset -= albumItems.length;
        if (offset === 0) item.classList.add("center");
        else if (offset === -1) item.classList.add("left-1");
        else if (offset === 1) item.classList.add("right-1");
      });
    }

    async function setup() {
      const vision = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/wasm");
      gestureRecognizer = await GestureRecognizer.createFromOptions(vision, {
        baseOptions: { modelAssetPath: "libs/gesture_recognizer.task", delegate: "GPU" },
        runningMode: "VIDEO"
      });
      const stream = await navigator.mediaDevices.getUserMedia({ video: { width: 1280, height: 720 } });
      video.srcObject = stream;
      video.onloadeddata = () => predict();
    }

    async function predict() {
      if (video.currentTime !== lastVideoTime) {
        lastVideoTime = video.currentTime;
        const results = gestureRecognizer.recognizeForVideo(video, Date.now());

        if (results.landmarks && results.landmarks.length > 0) {
          const lm = results.landmarks[0];
          const indexTip = lm[8];
          const thumbTip = lm[4];
          const pinkyMCP = lm[17];

          const cx = (1 - indexTip.x) * window.innerWidth;
          const cy = indexTip.y * window.innerHeight;
          cursor.style.left = `${cx}px`;
          cursor.style.top = `${cy}px`;

          const gesture = results.gestures[0] ? results.gestures[0][0].categoryName : "";
          const currentHandX = pinkyMCP.x;
          const velocity = currentHandX - prevHandX;

          // --- 핸드트래킹: 뒤로 가기 (오른쪽으로 밀기) ---
          if (!isCooldown && velocity < -0.04) {
            if (detailView.classList.contains("active")) {
              closeDetail();
              triggerCooldown(800);
            } else if (albumView.classList.contains("open")) {
              closeAlbums();
              triggerCooldown(800);
            } else if (gallery.classList.contains("active")) {
              // 메인 메뉴(카드) 상태일 때 뒤로 가기 감지 시 초기 화면으로 복구
              gallery.classList.remove("active");
              triggerCooldown(800);
            }
          }

          if (albumView.classList.contains("open") && !detailView.classList.contains("active")) {
            // --- 핸드트래킹: 앨범 넘기기 (왼쪽으로 밀기) ---
            if (!isCooldown && velocity > 0.03) {
              currentIndex = (currentIndex + 1) % albumItems.length;
              updateCarousel();
              triggerCooldown(500);
            }

            const centerItem = document.querySelector(".album-item.center");
            if (centerItem) {
              const rect = centerItem.getBoundingClientRect();
              const isOverCenter = cx > rect.left && cx < rect.right && cy > rect.top && cy < rect.bottom;

              if (isOverCenter && Math.abs(velocity) < 0.01) {
                stopCounter++;
                if (stopCounter > 10) centerItem.classList.add("focused");
              } else {
                stopCounter = 0;
                centerItem.classList.remove("focused");
              }

              if (gesture === "Closed_Fist" && !isCooldown && centerItem.classList.contains("focused")) {
                document.getElementById("detailTitle").textContent = centerItem.getAttribute("data-title");
                detailView.classList.add("active");
                triggerCooldown(1200);
              }
            }
          } else {
            // 버튼 조작 로직 (초기 로고 클릭 또는 메인 버튼들)
            const dist = Math.sqrt(Math.pow(indexTip.x - thumbTip.x, 2) + Math.pow(indexTip.y - thumbTip.y, 2));
            const target = document.elementFromPoint(cx, cy);

            if (target) {
              if (target.id === "detailClose" || target.id === "albumClose" || target.classList.contains("label-btn") || target.id === "starter" || target.parentElement.id === "starter") {
                target.classList.add("btn-hovered");
                stopCounter++;
                if (stopCounter > 35) {
                  // starter 로고 포함 모든 버튼 클릭 감지
                  if (target.id === "starter" || target.parentElement.id === "starter") {
                    gallery.classList.add("active");
                  } else {
                    target.click();
                  }
                  stopCounter = 0;
                  triggerCooldown(1000);
                }
              } else {
                stopCounter = 0;
                document.querySelectorAll(".btn-hovered").forEach(el => el.classList.remove("btn-hovered"));
              }

              if (dist < 0.045 && !isCooldown) {
                if (target.id === "starter" || target.parentElement.id === "starter") {
                  gallery.classList.add("active");
                } else {
                  target.click();
                }
                triggerCooldown(1000);
              }
            }
          }
          prevHandX = currentHandX;
        }
      }
      requestAnimationFrame(predict);
    }

    function triggerCooldown(ms) { isCooldown = true; setTimeout(() => isCooldown = false, ms); }

    setup();
  </script>
</body>

</html>
